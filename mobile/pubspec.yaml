name: splitcount
description: "A private, local-first expense splitting app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database (SQLite with Drift)
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & HTTP
  dio: ^5.4.3+1

  # Data Visualization & Charts
  fl_chart: ^0.68.0

  # Receipts & Exporting
  pdf: ^3.10.8
  printing: ^5.14.0
  csv: ^6.0.0
  share_plus: ^10.1.4

  # QR Code Sharing & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Date, formatting, uuid
  intl: ^0.19.0
  uuid: ^4.4.0

  # Package Info & Version Checks
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
